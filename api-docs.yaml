                  name: 김철수(수정)
                  email: kim_updated@example.com
                  phoneNumber: 010-2345-6789
                  callNumber: 02-234-5678
                  extensionNumber: "1002"
                  companyFax: 02-234-5679
                  imageUrl: http://example.com/images/kim_new.jpg
                  department: 4
