          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDto'
              example:
                status: error
                statusCode: 404
                message: 사원 정보를 찾을 수 없습니다.
                data: null
                pagination: null
        "200":
          description: 직원 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDto'
              example:
                status: success
                statusCode: 200
                message: 사원 정보를 성공적으로 삭제했습니다.
                data: 1
                pagination: null
