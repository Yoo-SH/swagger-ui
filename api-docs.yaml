components:
  schemas:
    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int32
        department:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        callNumber:
          type: string
        companyFax:
          type: string
        extensionNumber:
          type: string
        imageUrl:
          type: string
    ApiResponseDto:
      type: object
      properties:
        status:
          type: string
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: object
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    PutUpdateEmbeddingByIdRequestDto:
      required:
      - embeddingData
      type: object
      properties:
        embeddingData:
          type: array
          description: 임베딩 데이터
          example: "byte[]"
          items:
            type: string
            description: 임베딩 데이터
            format: byte
            example: Ynl0ZVtd
    PutUpdateDepartmentRequestDto:
      required:
      - name
      - parentId
      type: object
      properties:
        name:
          type: string
          description: 부서명
          example: 영업부
        role:
          type: string
          description: 역할
          example: 영업팀장
        memo:
          type: string
          description: 메모
          example: 영업팀장 메모
        parentId:
          type: integer
          description: 상위 부서번호
          format: int32
          example: 1
    PostCreateDoorLogByEmployeeIdRequestDto:
      required:
      - imageUrl
      - type
      type: object
      properties:
        type:
          pattern: ^(check_in|check_out)$
          type: string
          description: 타입
          example: check_in
        timestamp:
          type: string
          description: 타임스탬프
          example: 2024-01-01 09:00:00
        imageUrl:
          type: string
          description: 이미지 URL
          example: https://example.com/image.jpg
    PostCreateDepartmentRequestDto:
      required:
      - name
      - parentId
      type: object
      properties:
        name:
          type: string
          description: 부서명
          example: 영업부
        role:
          type: string
          description: 역할
          example: 영업팀장
        memo:
          type: string
          description: 메모
          example: 영업팀장 메모
        parentId:
          type: integer
          description: 상위 부서번호
          format: int32
          example: 1
    PostCreateCommuteLogByEmployeeIdRequestDto:
      type: object
      properties:
        reason:
          type: string
          description: 출퇴근 사유
          example: 도로 공사로 인한 교통 체증
        checkIn:
          type: string
          description: 출근시간
          example: 2024-01-01 09:00:00
        checkOut:
          type: string
          description: 퇴근시간
          example: 2024-01-01 18:00:00
        workDate:
          type: string
          description: 근무일
          example: 2024-01-01
        isLated:
          type: boolean
          description: 지각여부
          example: true
    PatchUpdateCommuteLogReasonRequestDto:
      required:
      - reason
      type: object
      properties:
        reason:
          type: string
          description: 출퇴근 사유
          example: 도로 공사로 인한 교통 체증
    PaginationRequestDto:
      type: object
      properties:
        pageNumber:
          minimum: 0
          type: integer
          description: 페이지 번호
          format: int32
          example: 0
        pageSize:
          minimum: 1
          type: integer
          description: 페이지 사이즈
          format: int32
          example: 10
        orderBy:
          type: string
          description: 정렬 기준
          example: id
        sortDirection:
          type: string
          description: 정렬 방향
          example: ASC | DESC
  responses:
    SuccessResponse:
      description: 성공 응답
      content:
        application/json:
          examples:
            성공_응답:
              summary: 성공 응답
              description: API 호출 성공 시 응답 형식
              value:
                data: []
                status: success
                message: 성공메시지
                statusCode: 2xx
    ErrorResponse:
      description: 오류 응답
      content:
        application/json:
          examples:
            오류_응답:
              summary: 오류 응답
              description: API 호출 실패 시 응답 형식
              value:
                data: []
                status: error
                message: 오류 메시지
                statusCode: 4xx/5xx
    PaginationResponse:
      description: 페이지네이션 응답
      content:
        application/json:
          examples:
            페이지네이션_응답:
              summary: 페이지네이션 응답
              description: 페이지네이션이 포함된 API 호출 성공 시 응답 형식
              value:
                message: 성공 메시지
                pagination:
                  totalItems: x
                  totalPages: x
                  currentPage: "x(default: 0)"
                data: []
                status: success
                statusCode: 2xx
