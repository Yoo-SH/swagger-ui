openapi: 3.0.1
info:
  title: 얼굴 인식 시스템 API
  description: |-
    출퇴근 및 출입 관리를 위한 얼굴 인식 시스템 API 문서입니다.

    ## 공통 응답 형식

    ### 성공 응답
    ```json
    {
      "status": "success",
      "statusCode": 200,
      "message": "성공 메시지",
      "data": [...]
    }
    ```

    ### 성공 페이지네이션 포함 응답(페이지네이션은 옵션입니다.)
    ```json
    {
      "status": "success",
      "statusCode": 2xx,
      "message": "성공 메시지",
      "data": [...]
      "pagination": {
        "currentPage": x,
        "totalPages": x,
        "totalItems": x
      }
    }
    ```

    ### 오류 응답
    ```json
    {
      "status": "error",
      "statusCode": 4xx/5xx,
      "message": "오류 메시지",
      "data": []
    }
    ```

    ```
  contact:
    name: Yoo_SH
    email: ads137485@jbnu.ac.kr
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: v1.0.0
servers:
- description: 로컬 서버
tags:
- name: CommuteLog
  description: 출퇴근 기록 관련 API
- name: Employee
  description: 직원 관리 관련 API
- name: CommuteTypeLog
  description: 출퇴근 유형 로그 관련 API
- name: DoorLog
  description: 출입 기록 관련 API
- name: Department
  description: 부서 관리 API
- name: CommuteType
  description: 출퇴근 유형 관리 관련 API
- name: Embedding
  description: 얼굴 인식 임베딩 관련 API
paths:
  /api/employee/{employeeId}:
